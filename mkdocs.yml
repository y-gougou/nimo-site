site_name: Nimo 的麦迪逊花园
site_description: 记录我的学习过程与收获
site_author: Nimo
site_url: https://nimo.github.io/

theme:
  name: material
  language: zh
  font:
    text: Noto Sans SC
  icon:
    logo: material/book-open-page-variant
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mermaid.min.js

plugins:
  - search:
      lang:
        - zh
        - en

nav:
  - 首页: index.md
  - 📚 今日课程:
    - 课程总览: course/index.md
    - 第 1 课 · Linux 软件包入门: course/01-package.md
    - 第 2 课 · 动手安装实战: course/02-install-practice.md
    - 第 3 课 · 为什么要用代理: course/03-proxy-basics.md
    - 第 4 课 · Clash Party 配置指南: course/04-clash-party.md
    - 第 5 课 · DNS 覆写是什么: course/05-dns-override.md
    - 第 6 课 · 常见问题排查手册: course/06-troubleshooting.md
