<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>🌸 秘密花园 - Nimo 的麦迪逊花园</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2dd4bf;
      --border: #30363d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .garden {
      max-width: 560px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 8px 40px rgba(0,0,0,.4);
    }
    .badge {
      display: inline-block;
      background: rgba(45,212,191,.12);
      color: var(--accent);
      border: 1px solid rgba(45,212,191,.35);
      border-radius: 999px;
      padding: .25rem .8rem;
      font-size: .8rem;
      letter-spacing: .05em;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.6rem; margin-bottom: .8rem; }
    .intro { color: var(--muted); font-size: .95rem; line-height: 1.7; margin-bottom: 2rem; }
    .photo {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 2rem;
    }
    .photo img { width: 100%; display: block; }
    .divider {
      height: 1px;
      background: var(--border);
      margin: 1.8rem 0;
    }
    .note { color: var(--muted); font-size: .85rem; line-height: 1.8; }
    .note strong { color: var(--text); }
    .back {
      display: inline-block;
      margin-top: 1.8rem;
      color: var(--accent);
      text-decoration: none;
      font-size: .9rem;
    }
    .back:hover { text-decoration: underline; }
    .footer {
      margin-top: 2rem;
      color: var(--muted);
      font-size: .75rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="garden">
    <span class="badge">🌸 秘密花园 · SECRET GARDEN</span>
    <h1>嘘——你找到了这里</h1>
    <p class="intro">
      这里不在地图（导航）上，只有有心人才能发现。<br>
      搜索框输入 <strong>nimo</strong>，或连续点击站名 logo 5 次，就能抵达这片花园。
    </p>

    <div class="photo">
      <img src="../assets/nimo.jpg" alt="nimo 的彩蛋图片">
    </div>

    <div class="divider"></div>

    <div class="note">
      <strong>这块地方还空着，等你来种下：</strong><br><br>
      · 想对未来的自己 / 访客说的话<br>
      · 隐藏的纪念日或故事<br>
      · 通关密语收集系统（集齐 6 课密语来兑换"毕业证书"）<br>
      · 任何你觉得有意思的东西
    </div>

    <a class="back" href="../">← 返回花园入口（首页）</a>

    <div class="footer">秘密花园 · 2026-08-13 开垦</div>
  </div>
</body>
</html>
