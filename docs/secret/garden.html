<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>🌸 秘密花园 - Nimo 的麦迪逊花园</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2dd4bf;
      --border: #30363d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .garden {
      max-width: 560px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 8px 40px rgba(0,0,0,.4);
    }
    .badge {
      display: inline-block;
      background: rgba(45,212,191,.12);
      color: var(--accent);
      border: 1px solid rgba(45,212,191,.35);
      border-radius: 999px;
      padding: .25rem .8rem;
      font-size: .8rem;
      letter-spacing: .05em;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.6rem; margin-bottom: .8rem; }
    .intro { color: var(--muted); font-size: .95rem; line-height: 1.7; margin-bottom: 2rem; }
    .photo {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 2rem;
    }
    .photo img { width: 100%; display: block; }
    .divider {
      height: 1px;
      background: var(--border);
      margin: 1.8rem 0;
    }
    .note { color: var(--muted); font-size: .85rem; line-height: 1.8; }
    .note strong { color: var(--text); }
    .back {
      display: inline-block;
      margin-top: 1.8rem;
      color: var(--accent);
      text-decoration: none;
      font-size: .9rem;
    }
    .back:hover { text-decoration: underline; }
    .footer {
      margin-top: 2rem;
      color: var(--muted);
      font-size: .75rem;
      text-align: center;
    }

    /* ---------- 互动区块 ---------- */
    .section-title {
      font-size: 1.15rem;
      margin-bottom: .6rem;
      display: flex;
      align-items: center;
      gap: .4rem;
    }
    .section-desc {
      color: var(--muted);
      font-size: .85rem;
      line-height: 1.7;
      margin-bottom: 1.2rem;
    }

    /* 倾诉表单 */
    .confess-form {
      background: rgba(13,17,23,.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
    }
    .confess-form label {
      display: block;
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: .5rem;
    }
    .confess-form textarea {
      width: 100%;
      min-height: 120px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .7rem;
      font-size: .9rem;
      font-family: inherit;
      resize: vertical;
      margin-bottom: .8rem;
    }
    .confess-form textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .confess-form .hint {
      font-size: .75rem;
      color: var(--muted);
      margin-bottom: .8rem;
    }
    .confess-form button {
      background: var(--accent);
      color: #0d1117;
      border: none;
      border-radius: 8px;
      padding: .55rem 1.4rem;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }
    .confess-form button:hover { opacity: .85; }
    .confess-form button:disabled { opacity: .5; cursor: not-allowed; }
    #confess-result {
      margin-top: .8rem;
      font-size: .85rem;
      color: var(--accent);
      min-height: 1.2em;
    }
    #confess-result.error { color: #f85149; }

    /* giscus 留言板 */
    .giscus-wrap {
      margin-top: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="garden">
    <span class="badge">🌸 秘密花园 · SECRET GARDEN</span>
    <h1>嘘——你找到了这里</h1>
    <p class="intro">
      这里不在地图（导航）上，只有有心人才能发现。<br>
      搜索框输入 <strong>nimo</strong>，或连续点击站名 logo 5 次，就能抵达这片花园。
    </p>

    <div class="photo">
      <img src="../assets/nimo.jpg" alt="nimo 的彩蛋图片">
    </div>

    <div class="divider"></div>

    <!-- ========== 匿名倾诉 ========== -->
    <h2 class="section-title">🌧️ 倾诉信箱</h2>
    <p class="section-desc">
      最近有什么烦心事吗？这里完全匿名，没有人知道你是谁。<br>
      写下来，就当是丢进了一封不会寄出的信。nimo 会看到，或许会回应。
    </p>

    <form class="confess-form" id="confess-form">
      <label for="confess-text">你的倾诉（无需署名，完全匿名）</label>
      <textarea id="confess-text" name="text" placeholder="在这里写下你的心事……" maxlength="5000"></textarea>
      <div class="hint">🔒 内容仅作者可见 · 不会公开 · 请勿填写真实姓名/联系方式</div>
      <button type="submit" id="confess-btn">寄出这封信 ✉️</button>
      <div id="confess-result"></div>
    </form>

    <div class="divider"></div>

    <!-- ========== 给作者留言 ========== -->
    <h2 class="section-title">💬 给 nimo 留言</h2>
    <p class="section-desc">
      想对作者说点什么？欢迎用 GitHub 账号留言。<br>
      nimo 会看到每一条留言，并在这里回复。
    </p>
    <div class="giscus-wrap">
      <script src="https://giscus.app/client.js"
              data-repo="y-gougou/nimo-site"
              data-repo-id="R_kgDOT3RtSg"
              data-category="Announcements"
              data-category-id="DIC_kwDOT3RtSs4DDSeF"
              data-mapping="pathname"
              data-strict="0"
              data-reactions-enabled="1"
              data-emit-metadata="0"
              data-input-position="bottom"
              data-theme="dark"
              data-lang="zh-CN"
              crossorigin="anonymous"
              async>
      </script>
    </div>

    <div class="divider"></div>

    <a class="back" href="../">← 返回花园入口（首页）</a>

    <div class="footer">秘密花园 · 2026-08-13 开垦</div>
  </div>

  <script>
    // 倾诉表单提交（Formspree）
    (function () {
      var form = document.getElementById('confess-form');
      var text = document.getElementById('confess-text');
      var btn = document.getElementById('confess-btn');
      var result = document.getElementById('confess-result');
      var FORMSPREE_URL = 'https://formspree.io/f/mnpavkqy';

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var content = (text.value || '').trim();
        if (content.length < 5) {
          result.textContent = '写点什么吧，哪怕只有一句话。';
          result.className = 'error';
          return;
        }
        btn.disabled = true;
        btn.textContent = '寄出中……';
        result.textContent = '';
        result.className = '';

        fetch(FORMSPREE_URL, {
          method: 'POST',
          headers: { 'Accept': 'application/json' },
          body: JSON.stringify({ text: content, page: '秘密花园-倾诉' })
        }).then(function (resp) {
          if (resp.ok) {
            result.textContent = '已收到你的倾诉，谢谢你愿意分享 🙏';
            text.value = '';
          } else {
            throw new Error('submit failed');
          }
        }).catch(function () {
          result.textContent = '发送失败了…… 可以直接告诉 nimo：y-gougou@github';
          result.className = 'error';
        }).finally(function () {
          btn.disabled = false;
          btn.textContent = '寄出这封信 ✉️';
        });
      });
    })();
  </script>
</body>
</html>
